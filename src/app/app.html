@if (!booted()) {
  <app-boot-splash (done)="booted.set(true)" />
}

<div class="flex h-dvh overflow-hidden">
  <!-- Sidebar -->
  @if (navOpen()) {
    <div class="fixed inset-0 z-30 bg-slate-950/60 md:hidden" (click)="navOpen.set(false)"></div>
  }
  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-60 -translate-x-full flex-col border-r border-slate-800 bg-slate-950/80 backdrop-blur-xl transition-transform md:static md:translate-x-0"
    [class.translate-x-0]="navOpen()"
  >
    <div class="flex h-14 items-center gap-2.5 px-4">
      <div class="grid size-7 place-items-center rounded-lg bg-brand shadow-[0_0_18px_rgb(99_102_241/0.5)]">
        <lucide-icon [img]="icons.Radar" [size]="15" class="text-white" />
      </div>
      <span class="text-[15px] font-semibold tracking-tight text-white">Prospect<span class="text-indigo-400">IQ</span></span>
      <span class="ml-auto rounded border border-slate-700 px-1 font-mono text-[10px] text-slate-500">US·CA</span>
    </div>

    <button class="mx-3 mb-3 flex h-8 items-center gap-2 rounded-lg border border-slate-800 bg-slate-900/60 px-2.5 text-xs text-slate-500 transition-colors hover:border-slate-700 hover:text-slate-300"
            (click)="paletteOpen.set(true)">
      <lucide-icon [img]="icons.Search" [size]="13" />
      Search or jump to…
      <span class="ml-auto flex gap-0.5"><span class="kbd">⌘</span><span class="kbd">K</span></span>
    </button>

    <nav class="flex-1 space-y-0.5 px-3">
      <div class="eyebrow px-2 pt-2 pb-1.5">Workspace</div>
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-800/80! text-white!"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="flex h-8 items-center gap-2.5 rounded-lg px-2 text-[13px] text-slate-400 transition-colors hover:bg-slate-800/50 hover:text-slate-200"
          (click)="navOpen.set(false)"
        >
          <lucide-icon [img]="item.icon" [size]="16" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="m-3 rounded-xl border border-indigo-500/20 bg-indigo-500/[0.07] p-3">
      <div class="flex items-center gap-1.5 text-xs font-medium text-indigo-200">
        <lucide-icon [img]="icons.Sparkles" [size]="13" /> AI credits
      </div>
      <div class="mt-2 h-1 overflow-hidden rounded-full bg-slate-800"><div class="h-full w-[68%] rounded-full bg-brand"></div></div>
      <div class="mt-1.5 font-mono text-[10px] text-slate-500 tabular-nums">6,812 / 10,000 this month</div>
    </div>

    <div class="flex items-center gap-2.5 border-t border-slate-800 p-3">
      <div class="grid size-7 place-items-center rounded-full bg-linear-to-br from-emerald-400 to-brand text-[11px] font-semibold text-white">JR</div>
      <div class="min-w-0 text-xs">
        <div class="truncate font-medium text-slate-200">Jordan Reyes</div>
        <div class="truncate text-slate-500">SDR Team · Toronto</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="relative flex min-w-0 flex-1 flex-col">
    @if (navigating()) {
      <div class="absolute inset-x-0 top-0 z-20 h-0.5 overflow-hidden">
        <div class="h-full w-full origin-left bg-linear-to-r from-brand via-violet-400 to-go" style="animation: indeterminate 1s ease-in-out infinite"></div>
      </div>
    }

    <header class="flex h-14 shrink-0 items-center gap-3 border-b border-slate-800 px-4 md:px-6">
      <button class="btn btn-ghost -ml-2 md:hidden" (click)="navOpen.set(true)" aria-label="Open navigation">
        <lucide-icon [img]="icons.Menu" [size]="16" />
      </button>
      <div class="flex items-center gap-1.5 text-xs text-slate-400">
        <span class="size-1.5 rounded-full bg-emerald-400 animate-pulse-dot"></span>
        Live · 2,104 signals today
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button class="btn btn-ghost hidden sm:inline-flex" (click)="paletteOpen.set(true)">
          <lucide-icon [img]="icons.Command" [size]="14" /> Command
        </button>
        <button class="btn btn-ghost relative" aria-label="Notifications">
          <lucide-icon [img]="icons.Bell" [size]="15" />
          <span class="absolute top-1.5 right-2 size-1.5 rounded-full bg-rose-400"></span>
        </button>
      </div>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>

@if (paletteOpen()) {
  <app-command-palette (close)="paletteOpen.set(false)" />
}
<app-toasts />
